  <rect x="153" y="324" width="40" height="86" rx="10" fill="rgba(255,255,255,0.58)"/>
  <rect x="215" y="290" width="46" height="120" rx="10" fill="rgba(255,255,255,0.90)"/>
  <rect x="279" y="324" width="40" height="86" rx="10" fill="rgba(255,255,255,0.58)"/>

